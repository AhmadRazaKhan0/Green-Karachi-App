kind = "web"
previewPath = "/"
title = "HelpHub AI – Community Support Platform"
version = "1.0.0"
id = "artifacts/helphub-ai"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20073

[services.development]
run = "pnpm --filter @workspace/helphub-ai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/helphub-ai", "run", "build" ]
publicDir = "artifacts/helphub-ai/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20073"
BASE_PATH = "/"
